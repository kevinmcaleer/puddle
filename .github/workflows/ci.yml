name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Each browser's suite is split into shards that run as parallel jobs, each kept under about five minutes.
    # Chromium and Firefox run on every pull request; WebKit runs nightly, in nightly.yml.
    name: Playwright tests in ${{ matrix.browser }} (${{ matrix.shard }} of ${{ matrix.shards }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1, shards: 2 }
          - { browser: chromium, shard: 2, shards: 2 }
          - { browser: firefox, shard: 1, shards: 2 }
          - { browser: firefox, shard: 2, shards: 2 }
    env:
      E2E_BROWSERS: ${{ matrix.browser }}
      E2E_BROWSER_LOGS: '1'
      # The PostgreSQL and MySQL flows read the shop from the service containers below through puddle-connect.
      PUDDLE_TEST_POSTGRES: postgres://postgres:puddle@localhost:5432/shop
      PUDDLE_TEST_MYSQL: mysql://root:puddle@localhost:3306/shop
      PUDDLE_TEST_FIREBIRD: firebird://SYSDBA:puddle@localhost:3050//var/lib/firebird/data/shop.fdb
      # The ClickHouse flow reads the shop in the browser, straight from the container's HTTP interface.
      PUDDLE_TEST_CLICKHOUSE: http://default:puddle@localhost:8123/shop
      # The DynamoDB flow reads the shop in the browser from scripts/dynamodb-stand-in.mjs: DynamoDB Local's -cors
      # answers the browser's preflight without the headers it asks for, so the browser never reaches it. The
      # databases job below reads DynamoDB Local itself.
      PUDDLE_TEST_DYNAMODB: dynamodb://AKIDEXAMPLE:secretexample@eu-west-2?endpoint=http://localhost:18092
      # The MongoDB flow reads a collection through puddle-connect; the Redis flow reads keys in the browser over the
      # Upstash stand-in (scripts/upstash-stand-in.mjs) in front of the Redis service.
      PUDDLE_TEST_MONGODB: mongodb://localhost:27017/shop
      PUDDLE_TEST_REDIS: redis://localhost:6379/0
      PUDDLE_TEST_UPSTASH: http://localhost:18079?token=puddle-token
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: puddle
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: puddle
          MYSQL_DATABASE: shop
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -ppuddle" --health-interval 5s --health-timeout 5s --health-retries 20
      firebird:
        image: firebirdsql/firebird:3
        env:
          FIREBIRD_ROOT_PASSWORD: puddle
          FIREBIRD_DATABASE: shop.fdb
        ports:
          - 3050:3050
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: puddle
        ports:
          - 8123:8123
        options: --health-cmd "wget -qO- http://localhost:8123/ping" --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        # MongoDB 8 refuses to start on Linux 6.19 and newer (SERVER-121912), which the hosted runners now have.
        image: mongo:7
        ports:
          - 27017:27017
        options: --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/seed-postgres.mjs "$PUDDLE_TEST_POSTGRES"
      - run: node scripts/seed-mysql.mjs "$PUDDLE_TEST_MYSQL"
      - run: node scripts/seed-firebird.mjs "$PUDDLE_TEST_FIREBIRD"
      - run: node scripts/seed-clickhouse.mjs "$PUDDLE_TEST_CLICKHOUSE"
      - run: (node scripts/dynamodb-stand-in.mjs 18092 AKIDEXAMPLE secretexample > /tmp/dynamodb-stand-in.log 2>&1 &) && sleep 1
      - run: node scripts/seed-dynamodb.mjs "$PUDDLE_TEST_DYNAMODB"
      - run: node scripts/seed-mongodb.mjs "$PUDDLE_TEST_MONGODB"
      - run: node scripts/seed-redis.mjs "$PUDDLE_TEST_REDIS"
      - run: (node scripts/upstash-stand-in.mjs 18079 puddle-token "$PUDDLE_TEST_REDIS" > /tmp/upstash-stand-in.log 2>&1 &) && sleep 1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run e2e -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  docs:
    # Retakes every screenshot from this commit's app, so a change that breaks one fails here, then builds the user
    # guide with warnings as errors. The pictures are kept as an artifact to compare with the committed ones.
    name: User guide and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: npm ci
      - run: pip install -r docs/requirements.txt
      - run: npx playwright install --with-deps chromium
      # The taxi tutorial's pictures are taken on the real TLC files, downloaded once and then cached.
      - uses: actions/cache@v4
        with:
          path: docs/_data
          key: tutorial-data-${{ hashFiles('scripts/fetch-tutorial-data.mjs') }}
      - run: npm run docs:tutorial-data
      # The browser's warnings and the page at a failure go in the log, as in the e2e jobs.
      - run: npm run docs:screenshots
        env:
          E2E_BROWSER_LOGS: '1'
      - run: npm run docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-guide
          path: |
            docs/_build/html
            test-results/docs
          retention-days: 7

  container:
    name: Container image and deployment tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: puddle:ci
          build-args: PUDDLE_BUILD=${{ github.sha }}
          cache-from: type=gha
      - name: Build the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: puddle:ci-arm64
          build-args: PUDDLE_BUILD=${{ github.sha }}
          cache-from: type=gha
      - name: Run the arm64 image
        run: |
          docker run -d --name puddle-arm64 --platform linux/arm64 --read-only --tmpfs /tmp -p 8089:8080 puddle:ci-arm64
          for i in $(seq 1 30); do curl -sf http://localhost:8089/healthz && break; sleep 1; done
          curl -sfI http://localhost:8089/ | grep -i 'cross-origin-embedder-policy: require-corp'
      - name: Run the amd64 image
        run: |
          docker run -d --name puddle --read-only --tmpfs /tmp -p 8088:8080 puddle:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8088/healthz && break; sleep 1; done
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e:container
        env:
          E2E_BROWSERS: chromium,firefox
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  runner:
    name: puddle-run image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the runner image for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the amd64 runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          load: true
          tags: puddle-run:ci
          cache-from: type=gha
      - name: Run a project file in the container
        run: |
          mkdir -p /tmp/projects
          cp tests/fixtures/projects/v1.puddle.json tests/fixtures/customers.csv /tmp/projects/
          chmod -R a+rwX /tmp/projects
          docker run --rm -v /tmp/projects:/projects puddle-run:ci check /projects/v1.puddle.json
          docker run --rm -v /tmp/projects:/projects puddle-run:ci run /projects/v1.puddle.json
          ls -l /tmp/projects/out
          test -s /tmp/projects/out/*.run.json
          grep -q '"status": "written"' /tmp/projects/out/*.run.json

  connect:
    name: puddle-connect
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:connect
      - name: Start the service, read a SQLite fixture through it, and check its refusals
        run: |
          PUDDLE_CONNECT_FILES=$PWD/tests/fixtures/db node dist-connect/puddle-connect.mjs --port 8765 > /tmp/connect.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8765/health | grep -q '"sqlite"'
          body='{"driver":"sqlite","settings":{"path":"'$PWD'/tests/fixtures/db/shop.sqlite"},"table":{"name":"customers"}}'
          curl -sf -D /tmp/headers -o /tmp/rows.arrow -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8765/read
          grep -qi 'puddle-rows: 3' /tmp/headers
          test -s /tmp/rows.arrow
          # A file outside the folders it may read, and a statement that writes, are refused.
          curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"driver":"sqlite","settings":{"path":"/etc/passwd"},"table":{"name":"x"}}' http://127.0.0.1:8765/catalog | grep -q 422
          curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"driver":"sqlite","settings":{"path":"'$PWD'/tests/fixtures/db/shop.sqlite"},"query":"DELETE FROM customers"}' http://127.0.0.1:8765/read | grep -q 400
          cat /tmp/connect.log
          ! grep -q hunter2 /tmp/connect.log
      - name: The image builds for amd64 and arm64
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.connect
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  databases:
    # The server drivers against real databases: each family's tests (tests/connect/*.test.ts) run against a container
    # seeded with tests/fixtures/db/seed*.sql. PostgreSQL, MySQL, MariaDB, Firebird and ClickHouse are services; CockroachDB,
    # SQL Server, Oracle, Trino, LibSQL (sqld), SurrealDB and DynamoDB Local are started by hand (no official healthcheck,
    # or a start too slow for one). BigQuery and Snowflake have no container: their rows run the stand-ins
    # (scripts/*-stand-in.mjs), which answer in the APIs' shapes and check the signed sign-in with a key made for the job;
    # a real project or account is the proof, when one is given. SAP HANA has no container either and no stand-in: its
    # driver is tested on hand-made fixtures only (src/connect/drivers/hana.test.ts). MongoDB, Redis (with the Upstash
    # stand-in in front of it for the REST interface), Cassandra (materialized views turned on) and ScyllaDB are started
    # by hand too.
    # Each row also re-records the family's fixtures and prints them, so tests/fixtures/db/<family>/ can be refreshed from
    # the log.
    name: ${{ matrix.name }} driver
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: PostgreSQL, driver: postgres, url: 'postgres://postgres:puddle@localhost:5432/shop', test: tests/connect/postgres.test.ts }
          - { name: CockroachDB, driver: cockroach, url: 'postgres://root@localhost:26257/shop', test: tests/connect/postgres.test.ts }
          - { name: MySQL, driver: mysql, url: 'mysql://root:puddle@localhost:3306/shop', test: tests/connect/mysql.test.ts }
          - { name: MariaDB, driver: mariadb, url: 'mysql://root:puddle@localhost:3307/shop', test: tests/connect/mysql.test.ts }
          - { name: Firebird, driver: firebird, url: 'firebird://SYSDBA:puddle@localhost:3050//var/lib/firebird/data/shop.fdb', test: tests/connect/firebird.test.ts }
          - { name: SQL Server, driver: sqlserver, url: 'sqlserver://sa:Puddle%21Test1@localhost:1433/shop', test: tests/connect/sqlserver.test.ts }
          - { name: Oracle, driver: oracle, url: 'oracle://shop:puddle@localhost:1521/FREEPDB1', test: tests/connect/oracle.test.ts }
          - { name: ClickHouse, driver: clickhouse, url: 'http://default:puddle@localhost:8123/shop', test: tests/connect/clickhouse.test.ts }
          - { name: Trino, driver: trino, url: 'http://puddle@localhost:8080/memory/shop', test: tests/connect/trino.test.ts }
          - { name: BigQuery (stand-in), driver: bigquery, url: 'bigquery://puddle-test/shop?key=/tmp/puddle-keys/bigquery-key.json&endpoint=http://127.0.0.1:18090', test: tests/connect/bigquery.test.ts }
          - { name: Snowflake (stand-in), driver: snowflake, url: 'snowflake://puddle@xy12345.eu-west-2.aws/shop/public?key=/tmp/puddle-keys/test.p8&warehouse=compute_wh&url=http://127.0.0.1:18091', test: tests/connect/snowflake.test.ts }
          - { name: LibSQL (sqld), driver: libsql, url: 'http://localhost:8081', test: tests/connect/libsql.test.ts }
          - { name: SurrealDB, driver: surrealdb, url: 'http://root:root@localhost:8000/shop/shop', test: tests/connect/surrealdb.test.ts }
          - { name: DynamoDB Local, driver: dynamodb, url: 'dynamodb://AKIDEXAMPLE:secretexample@eu-west-2?endpoint=http://localhost:8002&signatures=unchecked', test: tests/connect/dynamodb.test.ts }
          - { name: MongoDB, driver: mongodb, url: 'mongodb://localhost:27017/shop', test: tests/connect/mongodb.test.ts }
          - { name: Redis, driver: redis, url: 'redis://:puddle@localhost:6379/0', test: tests/connect/redis.test.ts }
          - { name: Cassandra, driver: cassandra, url: 'cassandra://localhost:9042/shop?datacenter=datacenter1', test: tests/connect/cassandra.test.ts }
          - { name: ScyllaDB, driver: scylla, url: 'cassandra://localhost:9043/shop?datacenter=datacenter1', test: tests/connect/cassandra.test.ts }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: puddle
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: puddle
          MYSQL_DATABASE: shop
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -ppuddle" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: puddle
          MARIADB_DATABASE: shop
        ports:
          - 3307:3306
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
      firebird:
        image: firebirdsql/firebird:3
        env:
          FIREBIRD_ROOT_PASSWORD: puddle
          FIREBIRD_DATABASE: shop.fdb
        ports:
          - 3050:3050
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: puddle
        ports:
          - 8123:8123
        options: --health-cmd "wget -qO- http://localhost:8123/ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Each family reads its own variable; the others are unset for that matrix row.
      PUDDLE_TEST_POSTGRES: ${{ startsWith(matrix.url, 'postgres') && matrix.url || '' }}
      PUDDLE_TEST_POSTGRES_DRIVER: ${{ matrix.driver }}
      PUDDLE_TEST_MYSQL: ${{ startsWith(matrix.url, 'mysql') && matrix.url || '' }}
      PUDDLE_TEST_MYSQL_DRIVER: ${{ matrix.driver }}
      PUDDLE_TEST_FIREBIRD: ${{ startsWith(matrix.url, 'firebird') && matrix.url || '' }}
      PUDDLE_TEST_SQLSERVER: ${{ startsWith(matrix.url, 'sqlserver') && matrix.url || '' }}
      PUDDLE_TEST_ORACLE: ${{ startsWith(matrix.url, 'oracle') && matrix.url || '' }}
      PUDDLE_TEST_CLICKHOUSE: ${{ matrix.driver == 'clickhouse' && matrix.url || '' }}
      PUDDLE_TEST_TRINO: ${{ matrix.driver == 'trino' && matrix.url || '' }}
      PUDDLE_TEST_BIGQUERY: ${{ matrix.driver == 'bigquery' && matrix.url || '' }}
      PUDDLE_TEST_SNOWFLAKE: ${{ matrix.driver == 'snowflake' && matrix.url || '' }}
      PUDDLE_TEST_LIBSQL: ${{ matrix.driver == 'libsql' && matrix.url || '' }}
      PUDDLE_TEST_SURREALDB: ${{ matrix.driver == 'surrealdb' && matrix.url || '' }}
      PUDDLE_TEST_DYNAMODB: ${{ matrix.driver == 'dynamodb' && matrix.url || '' }}
      PUDDLE_TEST_MONGODB: ${{ matrix.driver == 'mongodb' && matrix.url || '' }}
      PUDDLE_TEST_REDIS: ${{ matrix.driver == 'redis' && matrix.url || '' }}
      PUDDLE_TEST_UPSTASH: ${{ matrix.driver == 'redis' && 'http://127.0.0.1:18079?token=puddle-token' || '' }}
      PUDDLE_TEST_CASSANDRA: ${{ startsWith(matrix.url, 'cassandra') && matrix.url || '' }}
      PUDDLE_TEST_CASSANDRA_DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.driver == 'cockroach'
        run: docker run -d --name cockroach -p 26257:26257 cockroachdb/cockroach:latest-v24.1 start-single-node --insecure
      - if: matrix.driver == 'sqlserver'
        run: docker run -d --name sqlserver -p 1433:1433 -e ACCEPT_EULA=Y -e 'MSSQL_SA_PASSWORD=Puddle!Test1' mcr.microsoft.com/mssql/server:2022-latest
      - if: matrix.driver == 'oracle'
        run: docker run -d --name oracle -p 1521:1521 -e ORACLE_PASSWORD=puddle -e APP_USER=shop -e APP_USER_PASSWORD=puddle gvenzl/oracle-free:23-slim-faststart
      - if: matrix.driver == 'trino'
        run: docker run -d --name trino -p 8080:8080 trinodb/trino:446
      - if: matrix.driver == 'libsql'
        run: docker run -d --name sqld -p 8081:8080 ghcr.io/tursodatabase/libsql-server:latest
      - if: matrix.driver == 'surrealdb'
        run: docker run -d --name surrealdb -p 8000:8000 surrealdb/surrealdb:v2 start --user root --pass root memory
      - if: matrix.driver == 'dynamodb'
        run: docker run -d --name dynamodb -p 8002:8000 amazon/dynamodb-local:latest -jar DynamoDBLocal.jar -inMemory -sharedDb -cors '*'
      - if: matrix.driver == 'mongodb'
        run: docker run -d --name mongo -p 27017:27017 mongo:7  # not 8: it refuses Linux 6.19+ (SERVER-121912)
      - if: matrix.driver == 'redis'
        run: docker run -d --name redis -p 6379:6379 redis:7 redis-server --requirepass puddle
      - if: matrix.driver == 'cassandra'
        # Materialized views are off by default in Cassandra; the seed makes one, so the container turns them on first.
        run: >-
          docker run -d --name cassandra -p 9042:9042 -e MAX_HEAP_SIZE=1G -e HEAP_NEWSIZE=200M cassandra:5
          bash -c "sed -i 's/^materialized_views_enabled:.*/materialized_views_enabled: true/' /etc/cassandra/cassandra.yaml && exec docker-entrypoint.sh cassandra -f"
      - if: matrix.driver == 'scylla'
        run: docker run -d --name scylla -p 9043:9042 scylladb/scylla:6.2 --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1
      - if: matrix.driver == 'bigquery' || matrix.driver == 'snowflake'
        run: |
          node scripts/make-test-key.mjs /tmp/puddle-keys http://127.0.0.1:18090/token
          (node scripts/bigquery-stand-in.mjs 18090 /tmp/puddle-keys/bigquery-key.json > /tmp/bigquery-stand-in.log 2>&1 &)
          (node scripts/snowflake-stand-in.mjs 18091 /tmp/puddle-keys/test.p8 > /tmp/snowflake-stand-in.log 2>&1 &)
          sleep 2
      - if: startsWith(matrix.url, 'postgres')
        run: node scripts/seed-postgres.mjs "$PUDDLE_TEST_POSTGRES"
      - if: startsWith(matrix.url, 'mysql')
        run: node scripts/seed-mysql.mjs "$PUDDLE_TEST_MYSQL"
      - if: matrix.driver == 'firebird'
        run: node scripts/seed-firebird.mjs "$PUDDLE_TEST_FIREBIRD"
      - if: matrix.driver == 'sqlserver'
        run: node scripts/seed-sqlserver.mjs "$PUDDLE_TEST_SQLSERVER"
      - if: matrix.driver == 'oracle'
        run: node scripts/seed-oracle.mjs "$PUDDLE_TEST_ORACLE"
      - if: matrix.driver == 'clickhouse'
        run: node scripts/seed-clickhouse.mjs "$PUDDLE_TEST_CLICKHOUSE"
      - if: matrix.driver == 'trino'
        run: node scripts/seed-trino.mjs "$PUDDLE_TEST_TRINO"
      - if: matrix.driver == 'libsql'
        run: node scripts/seed-libsql.mjs "$PUDDLE_TEST_LIBSQL"
      - if: matrix.driver == 'surrealdb'
        run: node scripts/seed-surrealdb.mjs "$PUDDLE_TEST_SURREALDB"
      - if: matrix.driver == 'dynamodb'
        run: node scripts/seed-dynamodb.mjs "$PUDDLE_TEST_DYNAMODB"
      - if: matrix.driver == 'mongodb'
        run: node scripts/seed-mongodb.mjs "$PUDDLE_TEST_MONGODB"
      - if: matrix.driver == 'redis'
        run: |
          node scripts/seed-redis.mjs "$PUDDLE_TEST_REDIS"
          (node scripts/upstash-stand-in.mjs 18079 puddle-token "$PUDDLE_TEST_REDIS" > /tmp/upstash-stand-in.log 2>&1 &)
          sleep 1
      - if: startsWith(matrix.url, 'cassandra')
        run: node scripts/seed-cassandra.mjs "$PUDDLE_TEST_CASSANDRA"
      - run: npx vitest run ${{ matrix.test }} --project shared
      - name: Record the fixtures the unit tests replay, for refreshing tests/fixtures/db/${{ matrix.driver }}/
        if: matrix.driver == 'firebird' || matrix.driver == 'sqlserver' || matrix.driver == 'oracle' || matrix.driver == 'clickhouse' || matrix.driver == 'trino' || matrix.driver == 'libsql' || matrix.driver == 'surrealdb' || matrix.driver == 'dynamodb' || matrix.driver == 'mongodb' || matrix.driver == 'redis' || matrix.driver == 'cassandra'
        run: |
          node scripts/record-database.mjs ${{ matrix.driver }} "${{ matrix.url }}"
          echo '::group::queries.json'; cat tests/fixtures/db/${{ matrix.driver }}/queries.json 2>/dev/null || cat tests/fixtures/db/${{ matrix.driver }}/exchanges.json 2>/dev/null || cat tests/fixtures/db/${{ matrix.driver }}/calls.json; echo '::endgroup::'
          echo '::group::catalog.json'; cat tests/fixtures/db/${{ matrix.driver }}/catalog.json; echo '::endgroup::'
          git diff --stat -- tests/fixtures/db/${{ matrix.driver }}/
      - name: Record the Upstash fixtures too, for refreshing tests/fixtures/db/upstash/
        if: matrix.driver == 'redis'
        run: |
          node scripts/record-database.mjs upstash 'http://:puddle-token@127.0.0.1:18079'
          echo '::group::exchanges.json'; cat tests/fixtures/db/upstash/exchanges.json; echo '::endgroup::'
          echo '::group::catalog.json'; cat tests/fixtures/db/upstash/catalog.json; echo '::endgroup::'
          git diff --stat -- tests/fixtures/db/upstash/

  publish:
    name: Publish the image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, container, runner, connect, databases]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: PUDDLE_BUILD=${{ github.sha }}
          cache-from: type=gha
      - name: Publish the puddle-connect image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.connect
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-connect:latest
            ghcr.io/${{ github.repository }}-connect:${{ github.sha }}
          cache-from: type=gha
