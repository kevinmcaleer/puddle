name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The nightly run is WebKit's: it is the slowest browser and the one that flakes, so it is kept off pull requests
  # and run against main every night (03:00 UTC) instead. "Run workflow" on the Actions page runs it on demand.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'schedule' && 'ci-nightly' || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Each browser's suite is split into shards that run as parallel jobs, each kept under about five minutes.
    # Chromium and Firefox run on every pull request; WebKit runs nightly in the job below.
    name: Playwright tests in ${{ matrix.browser }} (${{ matrix.shard }} of ${{ matrix.shards }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1, shards: 2 }
          - { browser: chromium, shard: 2, shards: 2 }
          - { browser: firefox, shard: 1, shards: 2 }
          - { browser: firefox, shard: 2, shards: 2 }
    env:
      E2E_BROWSERS: ${{ matrix.browser }}
      E2E_BROWSER_LOGS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run e2e -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  e2e-webkit:
    # WebKit (Safari's engine) is about three times slower than the other browsers and the only one that flakes, so
    # it runs the whole Playwright suite against main every night, and on demand, rather than on every pull request.
    # A red nightly run emails the repository owner.
    name: Playwright tests in webkit, nightly (${{ matrix.shard }} of 3)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_BROWSERS: webkit
      E2E_BROWSER_LOGS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run e2e -- --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  container:
    name: Container image and deployment tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: puddle:ci
          build-args: PUDDLE_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: puddle:ci-arm64
          build-args: PUDDLE_BUILD=${{ github.sha }}
          cache-from: type=gha
      - name: Run the arm64 image
        run: |
          docker run -d --name puddle-arm64 --platform linux/arm64 --read-only --tmpfs /tmp -p 8089:8080 puddle:ci-arm64
          for i in $(seq 1 30); do curl -sf http://localhost:8089/healthz && break; sleep 1; done
          curl -sfI http://localhost:8089/ | grep -i 'cross-origin-embedder-policy: require-corp'
      - name: Run the amd64 image
        run: |
          docker run -d --name puddle --read-only --tmpfs /tmp -p 8088:8080 puddle:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8088/healthz && break; sleep 1; done
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e:container
        env:
          E2E_BROWSERS: chromium,firefox
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  publish:
    name: Publish the image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: PUDDLE_BUILD=${{ github.sha }}
          cache-from: type=gha
