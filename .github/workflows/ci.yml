name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Each browser's suite is split into shards that run as parallel jobs, each kept under about five minutes.
    # Chromium and Firefox run on every pull request; WebKit runs nightly, in nightly.yml.
    name: Playwright tests in ${{ matrix.browser }} (${{ matrix.shard }} of ${{ matrix.shards }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1, shards: 2 }
          - { browser: chromium, shard: 2, shards: 2 }
          - { browser: firefox, shard: 1, shards: 2 }
          - { browser: firefox, shard: 2, shards: 2 }
    env:
      E2E_BROWSERS: ${{ matrix.browser }}
      E2E_BROWSER_LOGS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run e2e -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  docs:
    # Retakes every screenshot from this commit's app, so a change that breaks one fails here, then builds the user
    # guide with warnings as errors. The pictures are kept as an artifact to compare with the committed ones.
    name: User guide and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: npm ci
      - run: pip install -r docs/requirements.txt
      - run: npx playwright install --with-deps chromium
      # The taxi tutorial's pictures are taken on the real TLC files, downloaded once and then cached.
      - uses: actions/cache@v4
        with:
          path: docs/_data
          key: tutorial-data-${{ hashFiles('scripts/fetch-tutorial-data.mjs') }}
      - run: npm run docs:tutorial-data
      # The browser's warnings and the page at a failure go in the log, as in the e2e jobs.
      - run: npm run docs:screenshots
        env:
          E2E_BROWSER_LOGS: '1'
      - run: npm run docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-guide
          path: |
            docs/_build/html
            test-results/docs
          retention-days: 7

  container:
    name: Container image and deployment tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: puddle:ci
          build-args: PUDDLE_BUILD=${{ github.sha }}
          cache-from: type=gha
      - name: Publish the puddle-connect image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.connect
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-connect:latest
            ghcr.io/${{ github.repository }}-connect:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: puddle:ci-arm64
          build-args: PUDDLE_BUILD=${{ github.sha }}
          cache-from: type=gha
      - name: Run the arm64 image
        run: |
          docker run -d --name puddle-arm64 --platform linux/arm64 --read-only --tmpfs /tmp -p 8089:8080 puddle:ci-arm64
          for i in $(seq 1 30); do curl -sf http://localhost:8089/healthz && break; sleep 1; done
          curl -sfI http://localhost:8089/ | grep -i 'cross-origin-embedder-policy: require-corp'
      - name: Run the amd64 image
        run: |
          docker run -d --name puddle --read-only --tmpfs /tmp -p 8088:8080 puddle:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8088/healthz && break; sleep 1; done
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e:container
        env:
          E2E_BROWSERS: chromium,firefox
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  runner:
    name: puddle-run image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the runner image for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the amd64 runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          load: true
          tags: puddle-run:ci
          cache-from: type=gha
      - name: Run a project file in the container
        run: |
          mkdir -p /tmp/projects
          cp tests/fixtures/projects/v1.puddle.json tests/fixtures/customers.csv /tmp/projects/
          chmod -R a+rwX /tmp/projects
          docker run --rm -v /tmp/projects:/projects puddle-run:ci check /projects/v1.puddle.json
          docker run --rm -v /tmp/projects:/projects puddle-run:ci run /projects/v1.puddle.json
          ls -l /tmp/projects/out
          test -s /tmp/projects/out/*.run.json
          grep -q '"status": "written"' /tmp/projects/out/*.run.json

  connect:
    name: puddle-connect
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:connect
      - name: Start the service, read a SQLite fixture through it, and check its refusals
        run: |
          PUDDLE_CONNECT_FILES=$PWD/tests/fixtures/db node dist-connect/puddle-connect.mjs --port 8765 > /tmp/connect.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8765/health | grep -q '"sqlite"'
          body='{"driver":"sqlite","settings":{"path":"'$PWD'/tests/fixtures/db/shop.sqlite"},"table":{"name":"customers"}}'
          curl -sf -D /tmp/headers -o /tmp/rows.arrow -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8765/read
          grep -qi 'puddle-rows: 3' /tmp/headers
          test -s /tmp/rows.arrow
          # A file outside the folders it may read, and a statement that writes, are refused.
          curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"driver":"sqlite","settings":{"path":"/etc/passwd"},"table":{"name":"x"}}' http://127.0.0.1:8765/catalog | grep -q 422
          curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"driver":"sqlite","settings":{"path":"'$PWD'/tests/fixtures/db/shop.sqlite"},"query":"DELETE FROM customers"}' http://127.0.0.1:8765/read | grep -q 400
          cat /tmp/connect.log
          ! grep -q hunter2 /tmp/connect.log
      - name: The image builds for amd64 and arm64
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.connect
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish the image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, container, runner, connect]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: PUDDLE_BUILD=${{ github.sha }}
          cache-from: type=gha
