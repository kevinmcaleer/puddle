# Puddle's static server. Every response carries the cross-origin isolation headers; hashed files are cached
# for a year, and the entry points (index.html, sw.js, precache.json, the manifest) are always revalidated.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # A types block replaces the default table, so this one includes nginx's own (which has application/wasm).
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # Redirects (/docs to /docs/) keep the address the browser used, behind a tunnel or another port.
  absolute_redirect off;

  # add_header in a location replaces the server's, so each location includes the shared headers.

  location /assets/ {
    include /etc/nginx/conf.d/puddle-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The self-hosted DuckDB extensions live under their DuckDB version, so they never change in place.
  location /duckdb-extensions/ {
    include /etc/nginx/conf.d/puddle-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    location = /duckdb-extensions/manifest.json {
      include /etc/nginx/conf.d/puddle-headers.inc;
      add_header Cache-Control "no-cache" always;
    }
    try_files $uri =404;
  }

  # The user guide, built from docs/ (see the Dockerfile).
  location = /docs {
    return 301 /docs/;
  }
  location /docs/ {
    include /etc/nginx/conf.d/puddle-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  # The taxi tutorial's two files, passed through from the TLC's site, whose own host doesn't let browsers read them
  # (no CORS). Nothing is kept here: each request, Range headers and all, goes straight to the TLC and back. Only these
  # two files, and only GET (and HEAD), so this isn't a way to reach anything else.
  location ~ ^/tutorial-data/(trip-data/yellow_tripdata_2024-01\.parquet|misc/taxi_zone_lookup\.csv)$ {
    limit_except GET { deny all; }
    # Written at start-up from the container's own DNS servers (deploy/30-puddle-resolver.sh). Resolving when a
    # request comes, not at start-up, lets Puddle start with no internet connection.
    include /tmp/puddle-resolver.conf;
    set $tlc d37ci6vzurychx.cloudfront.net;
    proxy_pass https://$tlc/$1;
    proxy_set_header Host $tlc;
    proxy_set_header Cookie "";
    proxy_ssl_server_name on;
    proxy_ssl_name $tlc;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/nginx/puddle-ca-certificates.crt;
    proxy_buffering off;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    include /etc/nginx/conf.d/puddle-headers.inc;
    add_header Cache-Control "no-store" always;
  }

  location /tutorial-data/ {
    return 404;
  }

  # puddle-connect, when its compose profile is up: the database service, which asks for its own bearer token and
  # reaches only its allowlist. Resolved per request (like the tutorial files), so Puddle starts without it. The
  # body is small (a connection's settings), the answer streams, and a read may take as long as the service allows.
  location /connect/ {
    limit_except GET POST OPTIONS { deny all; }
    include /tmp/puddle-resolver.conf;
    set $connect http://connect:8765;
    rewrite ^/connect/(.*)$ /$1 break;
    proxy_pass $connect;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    client_max_body_size 64k;
    include /etc/nginx/conf.d/puddle-headers.inc;
    add_header Cache-Control "no-store" always;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    include /etc/nginx/conf.d/puddle-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
