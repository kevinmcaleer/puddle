# Puddle as a Docker Compose stack. From the repository root:
#   docker compose up -d                      # Puddle on http://localhost:8088
#   docker compose --profile tunnel up -d     # also a Cloudflare Tunnel (needs CLOUDFLARE_TUNNEL_TOKEN)
#   docker compose --profile runner up -d     # also puddle-run, running the projects in ./projects on their schedules
#   docker compose --profile connect up -d    # also puddle-connect, reached at /connect/ (needs PUDDLE_CONNECT_TOKEN and PUDDLE_CONNECT_ALLOW)
# Settings come from the environment or a .env file next to this one. See deploy/README.md.
services:
  puddle:
    # Uses the image built from the Dockerfile (`docker build -t puddle .`), and builds it if it's missing.
    # Set PUDDLE_IMAGE=ghcr.io/kevinmcaleer/puddle:latest to run the image CI publishes instead.
    image: ${PUDDLE_IMAGE:-puddle:latest}
    build:
      context: .
      args:
        FETCH_EXTENSIONS: ${FETCH_EXTENSIONS:-1}
    restart: unless-stopped
    read_only: true
    # nginx keeps its pid and temporary files here.
    tmpfs: [/tmp]
    ports: ['${PUDDLE_PORT:-8088}:8080']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # puddle-run watches a folder of .puddle.json files and runs each on the schedule set in its Project tab.
  # Put project files and their source files (or a sources/ folder) in PUDDLE_PROJECTS; outputs land in its out/ folder.
  runner:
    profiles: [runner]
    image: ${PUDDLE_RUNNER_IMAGE:-puddle-run:latest}
    build:
      context: .
      dockerfile: Dockerfile.runner
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      # Secrets for the projects' database connections: a JSON file { "<connection name>": "<secret>" } at
      # PUDDLE_SECRETS_FILE on the host (outside the repository, mode 600), mounted read-only; until one is given
      # the empty /dev/null is mounted. PUDDLE_SECRET_<NAME> variables work too.
      PUDDLE_SECRETS: /run/puddle/secrets.json
    volumes:
      - '${PUDDLE_PROJECTS:-./projects}:/projects'
      - '${PUDDLE_SECRETS_FILE:-/dev/null}:/run/puddle/secrets.json:ro'
    command: ['watch', '/projects', '--poll', '${PUDDLE_RUNNER_POLL:-30}']

  # puddle-connect speaks the database protocols a browser cannot. It sits on the internal network only; nginx in the
  # puddle service proxies /connect/ to it. The service itself refuses to start without PUDDLE_CONNECT_TOKEN (the
  # variable is not required here, since Compose checks every service's settings even for profiles that are off, and
  # plain `docker compose up` must work without it), and reaches only the hosts in PUDDLE_CONNECT_ALLOW (empty reaches
  # nothing). Put Cloudflare Access on /connect/ as well: deploy/README.md.
  connect:
    profiles: [connect]
    image: ${PUDDLE_CONNECT_IMAGE:-puddle-connect:latest}
    build:
      context: .
      dockerfile: Dockerfile.connect
    restart: unless-stopped
    read_only: true
    environment:
      PUDDLE_CONNECT_TOKEN: ${PUDDLE_CONNECT_TOKEN:-}
      PUDDLE_CONNECT_ALLOW: ${PUDDLE_CONNECT_ALLOW:-}
      PUDDLE_CONNECT_TIMEOUT: ${PUDDLE_CONNECT_TIMEOUT:-60}
      PUDDLE_CONNECT_ORIGIN: ${PUDDLE_CONNECT_ORIGIN:-}
    volumes: ['${PUDDLE_CONNECT_DATA:-./data}:/data:ro']

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      puddle:
        condition: service_healthy
